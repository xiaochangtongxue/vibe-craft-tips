<style>
/* ---------- 001 拟物按钮 ---------- */
.stage--paper { background: var(--paper); color: var(--paper-ink); }
.b-grid { display: flex; flex-direction: column; gap: 28px; }
.b-row { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; }
.b-row--lg { --btn-font: 16px; }
.btn {
  --u: calc(var(--btn-font, 14px) / 14);
  appearance: none; display: inline-flex; align-items: center; justify-content: center; gap: calc(8 * var(--u));
  height: calc(40 * var(--u)); padding: 0 calc(18 * var(--u)); border-radius: calc(10 * var(--u));
  border: var(--u) solid var(--edge); font: 600 var(--btn-font, 14px)/1 var(--font); color: var(--ink);
  background: linear-gradient(180deg, var(--top), var(--bot)); cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent;
  /* 顺序固定：顶部高光、底部暗线、接触影、抬升影。inset 写在自身 box-shadow 里，自动沿内圆角走 */
  box-shadow: inset 0 var(--u) 0 var(--hi), inset 0 calc(-1 * var(--u)) 0 var(--lo),
    0 var(--u) calc(2 * var(--u)) var(--contact), 0 calc(4 * var(--u)) calc(10 * var(--u)) calc(-3 * var(--u)) var(--lift);
  transition: transform 120ms ease, box-shadow 140ms ease, --top 160ms ease, --bot 160ms ease, color 160ms ease, border-color 160ms ease;
}
.btn svg { width: calc(16 * var(--u)); height: calc(16 * var(--u)); flex: none; }
.btn--primary { --top: #404859; --bot: #273042; --top-h: #4a5468; --bot-h: #2d3648; --edge: #12161F; --ink: #fff;
  --hi: rgba(255,255,255,.18); --lo: rgba(0,0,0,.22); --contact: rgba(15,23,42,.18); --lift: rgba(15,23,42,.28);
  --press: rgba(0,0,0,.40); --under: 0 0 0 0 transparent; text-shadow: 0 calc(-1 * var(--u)) 0 rgba(0,0,0,.28); }
.btn--secondary { --top: #FFFFFF; --bot: #F4F5F7; --top-h: #FFFFFF; --bot-h: #F9FAFB; --edge: rgba(15,23,42,.14); --ink: #1F2937;
  --hi: rgba(255,255,255,1); --lo: rgba(0,0,0,.06); --contact: rgba(15,23,42,.06); --lift: rgba(15,23,42,.09);
  --press: rgba(15,23,42,.14); --under: 0 1px 0 rgba(255,255,255,.9); }
.btn--tertiary { --top: #F3F4F6; --bot: #E7E9EC; --top-h: #F7F8F9; --bot-h: #ECEEF1; --edge: rgba(15,23,42,.10); --ink: #1F2937;
  --hi: rgba(255,255,255,.85); --lo: rgba(0,0,0,.06); --contact: rgba(15,23,42,.06); --lift: rgba(15,23,42,.09);
  --press: rgba(15,23,42,.12); --under: 0 1px 0 rgba(255,255,255,.9); }
.btn--ghost { --top: rgba(15,23,42,0); --bot: rgba(15,23,42,0); --top-h: rgba(15,23,42,.05); --bot-h: rgba(15,23,42,.05); --edge: transparent; --ink: #374151;
  --hi: transparent; --lo: transparent; --contact: transparent; --lift: transparent; --press: rgba(15,23,42,.16); --under: 0 1px 0 rgba(255,255,255,.9); }
.btn:hover { --top: var(--top-h); --bot: var(--bot-h);
  box-shadow: inset 0 var(--u) 0 var(--hi), inset 0 calc(-1 * var(--u)) 0 var(--lo),
    0 var(--u) calc(2 * var(--u)) var(--contact), 0 calc(8 * var(--u)) calc(16 * var(--u)) calc(-5 * var(--u)) var(--lift); }
/* 按下：层数与静止态一致（2 inset + 2 外层），阴影才能过渡而不是跳变 */
.btn:active { transform: translateY(var(--u)); background: linear-gradient(180deg, var(--bot), var(--top));
  box-shadow: inset 0 var(--u) calc(2 * var(--u)) var(--press), inset 0 0 0 transparent, 0 var(--u) var(--u) var(--contact), var(--under); }
.btn--ghost:active { --top: rgba(15,23,42,.07); --bot: rgba(15,23,42,.07); }
.btn-text { display: inline-flex; align-items: center; gap: 6px; font: 500 var(--btn-font, 14px)/1 var(--font); color: #4B5563;
  text-decoration: underline; text-decoration-color: rgba(75,85,99,.35); text-underline-offset: 5px; text-decoration-thickness: 1px; padding: 8px 4px; transition: color 160ms; }
.btn-text:hover { color: #111827; }
.btn-text svg { width: 14px; height: 14px; transition: transform 160ms ease; }
.btn-text:hover svg { transform: translateX(3px); }
</style>
