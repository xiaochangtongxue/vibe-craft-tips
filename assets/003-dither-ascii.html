.d-wrap { display: grid; grid-template-columns: minmax(0, 1fr) 264px; gap: 20px; align-items: start; }
@media (max-width: 860px) { .d-wrap { grid-template-columns: minmax(0, 1fr); } }
.d-box { position: relative; aspect-ratio: 16 / 10; max-width: 100%; border-radius: 16px; overflow: hidden; background: var(--surface); }
.d-box canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.d-prev { opacity: 0; transition: opacity 150ms linear; pointer-events: none; }
.d-panel { display: flex; flex-direction: column; gap: 14px; background: var(--surface); border-radius: 14px; padding: 16px; box-shadow: 0 0 0 1px var(--line); }
.field { display: grid; grid-template-columns: 64px minmax(0, 1fr) 30px; align-items: center; gap: 10px; font-size: 13px; }

.field output { font: 12px var(--mono); text-align: right; font-variant-numeric: tabular-nums; }
.field select { grid-column: 2 / 4; height: 30px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--stage); padding: 0 8px; }

  <div class="tip-h"><span class="no">003</span><h2>Dither 与 ASCII 参数化效果</h2><a class="src" href="https://x.com/Kubai087/status/2115091203465290087" target="_blank" rel="noopener">原帖 ↗</a></div>
  <p class="lede">给登录页或 Hero 图加一层可调的纹理，再用竖向遮罩让画面退后，读起来像材质而不是噪点。</p>
  <div class="stage">
    <div class="d-wrap">
      <div class="d-box" id="dBox"><canvas id="dBase"></canvas><canvas id="dFx"></canvas><canvas id="dPrev" class="d-prev"></canvas></div>
      <div class="d-panel">
        <div class="seg" id="dMode" role="group" aria-label="滤镜"><button type="button" data-v="ascii" aria-pressed="true">ASCII</button><button type="button" data-v="dither" aria-pressed="false">Dither</button></div>
        <div class="field"><label for="dColor">色调</label><select id="dColor"><option value="original">Original</option><option value="meadow">Meadow</option><option value="blue">Blue</option><option value="amber">Amber</option><option value="lavender">Lavender</option><option value="mono">Mono</option></select></div>
        <div class="field" id="dToneRow"><label>取样</label><div class="seg" id="dTone" role="group" aria-label="取样区域"><button type="button" data-v="shadows" aria-pressed="true">暗部</button><button type="button" data-v="highlights" aria-pressed="false">亮部</button></div></div>
        <div class="field"><label for="dMask">遮罩</label><input type="range" id="dMask" min="0" max="100"><output for="dMask"></output></div>
        <div class="field"><label for="dStrength">采样强度</label><input type="range" id="dStrength" min="0" max="100"><output for="dStrength"></output></div>

      </div>

  <ul class="specs"><li>字符表 "  .,:;-=+xX08S#&amp;@"</li><li>Bayer 4×4 有序抖动</li><li>L 取第 8 / 92 百分位归一化</li><li>两个滤镜各自记住参数</li></ul>
</section>
<p class="credit">技巧思路与数值来自 <a href="https://x.com/Kubai087" target="_blank" rel="noopener">枯白啃设计 @Kubai087</a> 的《999 个小技巧，让你 Vibe 的产品更有质感》，页面是按原帖 Prompt 的复现，效果以原帖视频为准。</p>

<script src="base.js"></script>
<script>
/* ---------- 003 Dither / ASCII ---------- */
(() => {
  const box = $('#dBox'), base = $('#dBase'), fx = $('#dFx'), prev = $('#dPrev');
  const CH = '  .,:;-=+xX08S#&@';
  const BAYER = [[0, 8, 2, 10], [12, 4, 14, 6], [3, 11, 1, 9], [15, 7, 13, 5]];
  const PAL = {
    meadow: ['#2B361F', '#677D45', '#AEBA78', '#E5E1BD'], blue: ['#192A4D', '#326AC5', '#A2C2F1', '#EDF3FC'],
    amber: ['#3C200F', '#A74C15', '#EF9A46', '#F7E7CA'], lavender: ['#292144', '#6552AB', '#B3A5E4', '#F0ECFB'],
    mono: ['#151515', '#575757', '#A6A6A6', '#ECECEC']
  };
  const P = {
    ascii: { mask: 90, color: 'original', tone: 'shadows', strength: 100, size: 37, spacing: 0 },
    dither: { mask: 88, color: 'original', strength: 100, size: 15, spacing: 0 }
  };
  let mode = 'ascii';
  const range = (v, a, b) => a + (b - a) * v / 100;
  const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));

  // 程序生成的素材：暮色山湖
  const src = document.createElement('canvas');
  src.width = 1280; src.height = 800;
  (() => {
    const c = src.getContext('2d'), W = src.width, H = src.height;
    const sky = c.createLinearGradient(0, 0, 0, H * .62);
    sky.addColorStop(0, '#16224d'); sky.addColorStop(.45, '#5a4f9c'); sky.addColorStop(.78, '#e48a6a'); sky.addColorStop(1, '#ffd49a');
    c.fillStyle = sky; c.fillRect(0, 0, W, H);
    const sun = c.createRadialGradient(W * .66, H * .5, 10, W * .66, H * .5, 260);
    sun.addColorStop(0, 'rgba(255,246,214,1)'); sun.addColorStop(.25, 'rgba(255,226,170,.9)'); sun.addColorStop(1, 'rgba(255,200,140,0)');
    c.fillStyle = sun; c.fillRect(0, 0, W, H);
    let seed = 7;
    const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    const ridge = (y0, amp, col, step) => {
      c.beginPath(); c.moveTo(0, H);
      let y = y0;
      for (let x = 0; x <= W + step; x += step) { y += (rnd() - .5) * amp; y = y * .85 + y0 * .15; c.lineTo(x, y); }
      c.lineTo(W, H); c.closePath(); c.fillStyle = col; c.fill();
    };
    ridge(H * .5, 70, '#7a5a8e', 40); ridge(H * .56, 80, '#4b3b72', 32); ridge(H * .63, 60, '#2a2148', 24);
    const lake = c.createLinearGradient(0, H * .7, 0, H);
    lake.addColorStop(0, '#3a2f5c'); lake.addColorStop(1, '#0f0c1f');
    c.fillStyle = lake; c.fillRect(0, H * .7, W, H * .3);
    for (let i = 0; i < 26; i++) {
      const y = H * .72 + i * 9, w = 220 - i * 7;
      c.fillStyle = `rgba(255,214,160,${.5 - i * .017})`;
      c.fillRect(W * .66 - w / 2 + (rnd() - .5) * 20, y, w, 3);
    }
    ridge(H * .9, 30, '#0a0816', 18);
  })();

  const lutCache = {};
  function lut(name) {
    if (name === 'original') return null;
    if (lutCache[name]) return lutCache[name];
    const st = PAL[name].map(hex), pos = [0, .4, .74, 1], out = new Uint8ClampedArray(256 * 3);
    for (let i = 0; i < 256; i++) {
      const t = i / 255;
      let k = 0;
      while (k < 2 && t > pos[k + 1]) k++;
      const f = (t - pos[k]) / (pos[k + 1] - pos[k]);
      for (let j = 0; j < 3; j++) out[i * 3 + j] = st[k][j] + (st[k + 1][j] - st[k][j]) * f;
    }
    return (lutCache[name] = out);
  }
  function maskAlpha(baseA, v) {
    return v <= 50 ? baseA * Math.pow(v / 50, 1.08) : baseA + (1 - baseA) * Math.pow((v - 50) / 50, 1.08);
  }
  function drawMask(ctx, W, H, v) {
    const dark = isDarkTheme(), c = dark ? '0,0,0' : '255,255,255', b = dark ? [.44, .20, .50] : [.54, .20, .38];
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, `rgba(${c},${maskAlpha(b[0], v)})`);
    g.addColorStop(.42, `rgba(${c},${maskAlpha(b[1], v)})`);
    g.addColorStop(1, `rgba(${c},${maskAlpha(b[2], v)})`);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
  function rgb2hsv(r, g, b) {
    r /= 255; g /= 255; b /= 255;
    const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn;
    let h = 0;
    if (d) h = mx === r ? ((g - b) / d) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
    return [h * 60, mx ? d / mx : 0, mx];
  }
  function hsv2rgb(h, s, v) {
    const f = n => { const k = (n + h / 60) % 6; return v - v * s * Math.max(0, Math.min(k, 4 - k, 1)); };
    return [f(5) * 255, f(3) * 255, f(1) * 255];
  }

  function render(fade) {
    const W = box.clientWidth, H = box.clientHeight;
    if (!W || !H) return;
    const p = P[mode];
    if (fade && fx.width) {
      prev.width = fx.width; prev.height = fx.height;
      const pc = prev.getContext('2d');
      pc.drawImage(base, 0, 0); pc.drawImage(fx, 0, 0);
      prev.style.transition = 'none'; prev.style.opacity = 1; prev.offsetWidth;
      prev.style.transition = ''; prev.style.opacity = 0;
    }
    const dpr = Math.min(1.6, devicePixelRatio || 1), cw = Math.min(2048, Math.round(W * dpr)), chh = Math.min(2048, Math.round(H * dpr));
    for (const c of [base, fx]) { c.width = cw; c.height = chh; }
    const sx = cw / W;
    // 底图：cover 方式绘制，有色板时按亮度映射
    const bc = base.getContext('2d');
    const s0 = Math.max(cw / src.width, chh / src.height);
    bc.drawImage(src, (cw - src.width * s0) / 2, (chh - src.height * s0) / 2, src.width * s0, src.height * s0);
    const L = lut(p.color);
    if (L) {
      const im = bc.getImageData(0, 0, cw, chh), d = im.data;
      for (let i = 0; i < d.length; i += 4) {
        const l = Math.round(.299 * d[i] + .587 * d[i + 1] + .114 * d[i + 2]) * 3;
        d[i] = L[l]; d[i + 1] = L[l + 1]; d[i + 2] = L[l + 2];
      }
      bc.putImageData(im, 0, 0);
    }
    // 采样画布：长边约 480px
    const k = 480 / Math.max(W, H), sw = Math.max(1, Math.round(W * k)), sh = Math.max(1, Math.round(H * k));
    const smp = document.createElement('canvas'); smp.width = sw; smp.height = sh;
    const sc = smp.getContext('2d', { willReadFrequently: true });
    sc.fillStyle = '#fff'; sc.fillRect(0, 0, sw, sh);
    sc.drawImage(base, 0, 0, sw, sh);
    const sd = sc.getImageData(0, 0, sw, sh).data;
    const at = (u, v) => { const x = Math.min(sw - 1, Math.max(0, Math.floor(u * sw))), y = Math.min(sh - 1, Math.max(0, Math.floor(v * sh))), i = (y * sw + x) * 4; return [sd[i], sd[i + 1], sd[i + 2]]; };
    const lum = c => (.299 * c[0] + .587 * c[1] + .114 * c[2]) / 255;
    const n = sw * sh, step = Math.max(1, Math.floor(n / 12000)), Ls = [];
    for (let i = 0; i < n; i += step) Ls.push((.299 * sd[i * 4] + .587 * sd[i * 4 + 1] + .114 * sd[i * 4 + 2]) / 255);
    Ls.sort((a, b) => a - b);
    const lo = Ls[Math.floor(Ls.length * .08)], hi = Ls[Math.floor(Ls.length * .92)];
    const s = p.strength / 100;
    const ctx = fx.getContext('2d');
    ctx.setTransform(sx, 0, 0, sx, 0, 0);
    ctx.clearRect(0, 0, W, H);

    if (mode === 'ascii') {
      drawMask(ctx, W, H, p.mask);
      const fs = Math.round(Math.min(range(p.size, 7, 24), W < 720 ? 22 : 24));
      ctx.font = `500 ${fs}px "Geist Mono", ui-monospace, Menlo, monospace`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      let wmax = 0;
      for (const ch of CH) wmax = Math.max(wmax, ctx.measureText(ch).width);
      const m = ctx.measureText('@'), hAt = (m.actualBoundingBoxAscent + m.actualBoundingBoxDescent) || fs * .8;
      const gx = Math.max(range(p.spacing, 8, 24), wmax * 1.08), gy = Math.max(range(p.spacing, 9, 26), hAt * 1.12, fs * 1.04);
      const shadows = p.tone === 'shadows';
      for (let y = gy / 2; y < H; y += gy) for (let x = gx / 2; x < W; x += gx) {
        const c = at(x / W, y / H), l = lum(c);
        const raw = shadows ? 1 - l : l;
        let nrm = clamp((l - lo) / ((hi - lo) || 1));
        if (shadows) nrm = 1 - nrm;
        let tone = clamp(raw + (nrm - raw) * (.72 + .14 * s));
        const sm = tone * tone * (3 - 2 * tone);
        tone = clamp(tone + (sm - tone) * s);
        if (tone <= .02) continue;
        const [h, sa, v] = rgb2hsv(c[0], c[1], c[2]);
        const [r, g, b] = hsv2rgb(h, Math.min(1, sa * 1.12), Math.min(1, v * 1.1 + .06));
        ctx.fillStyle = `rgba(${r | 0},${g | 0},${b | 0},${clamp(.06 + tone * (.55 + .33 * s), .06, .94)})`;
        ctx.fillText(CH[Math.round(tone * 16)], x, y);
      }
    } else {
      const block = Math.max(2, Math.round(Math.min(range(p.size, 2, 9), W < 720 ? 7 : 9)));
      const scale = Math.max(1, Math.round(range(p.spacing, 1, 4)));
      const levels = Math.max(2, Math.round(range(p.strength, 8, 2)));
      const blend = range(p.strength, .32, 1);
      const cols = Math.ceil(W / block), rows = Math.ceil(H / block);
      const sm = document.createElement('canvas'); sm.width = cols; sm.height = rows;
      const smx = sm.getContext('2d'), im = smx.createImageData(cols, rows), d = im.data;
      for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
        const c = at((x + .5) * block / W, (y + .5) * block / H), l = lum(c) * 255;
        const thr = (BAYER[Math.floor(y / scale) % 4][Math.floor(x / scale) % 4] + .5) / 16;
        const i = (y * cols + x) * 4;
        for (let j = 0; j < 3; j++) {
          const v = clamp((l + (c[j] - l) * 1.18) / 255);
          const q = clamp(Math.floor(v * (levels - 1) + thr) / (levels - 1));
          d[i + j] = c[j] + (q * 255 - c[j]) * blend;
        }
        d[i + 3] = 255;
      }
      smx.putImageData(im, 0, 0);
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(sm, 0, 0, cols * block, rows * block);
      drawMask(ctx, W, H, p.mask);
    }
  }

  const ids = ['mask', 'strength', 'size', 'spacing'];
  const inputs = Object.fromEntries(ids.map(k => [k, $('#d' + k[0].toUpperCase() + k.slice(1))]));
  function syncUI() {
    const p = P[mode];
    ids.forEach(k => { inputs[k].value = p[k]; inputs[k].nextElementSibling.textContent = p[k]; });
    $('#dColor').value = p.color;
    $('#dToneRow').hidden = mode !== 'ascii';
    if (mode === 'ascii') $$('#dTone button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === p.tone)));
  }
  let tm = 0;
  const later = () => { clearTimeout(tm); tm = setTimeout(() => render(false), 72); };
  ids.forEach(k => inputs[k].addEventListener('input', () => { P[mode][k] = +inputs[k].value; inputs[k].nextElementSibling.textContent = inputs[k].value; later(); }));
  $('#dColor').addEventListener('change', e => { P[mode].color = e.target.value; render(true); });
  seg($('#dMode'), v => { mode = v; syncUI(); render(true); });
  seg($('#dTone'), v => { P.ascii.tone = v; render(true); });
  syncUI();
  new ResizeObserver(() => render(false)).observe(box);
  onThemeChange(() => render(true));
  document.fonts && document.fonts.ready.then(() => render(false));
})();
</script>
